name: Build containers

on:
  workflow_dispatch:

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  TOOLCHAIN_TAG: 4.5-latest

jobs:
  build:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha,scope=linux
          cache-to: type=gha,mode=max,scope=linux
          context: containers
          file: containers/Dockerfile.linux
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          platforms: linux/amd64
          tags: godot-build-linux:test

      - name: "Test: Build Godot template"
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            godot-build-linux:test \
            ./scripts/build-linux.sh \
            --build-name ci \
            --status ci \
            --target template_release

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/godot-builds-linux
        run: |
          short_sha=${GITHUB_SHA::12}
          docker tag godot-build-linux:test "$IMAGE:sha-$short_sha"
          docker push "$IMAGE:sha-$short_sha"

          if [[ $GITHUB_REF == refs/heads/main ]]; then
            docker tag godot-build-linux:test "$IMAGE:$TOOLCHAIN_TAG"
            docker push "$IMAGE:$TOOLCHAIN_TAG"
          fi
